<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Simulator Dashboard</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- Login Modal -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <h2>Login</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary">Login</button>
                <div id="loginError" class="error-message"></div>
            </form>
        </div>
    </div>

    <!-- Main Container -->
    <div id="mainContainer" style="display: none;">
        <!-- Navbar -->
        <nav class="navbar">
            <div class="navbar-brand">
                <img src="/images/logo.jpg" alt="Logo" style="height: 40px; vertical-align: middle; margin-right: 10px;">
                Robot Simulator
            </div>
            <div class="navbar-menu">
                <a href="#" class="navbar-item active" data-page="dashboard">Dashboard</a>
                <a href="#" class="navbar-item" data-page="settings">Settings</a>
                <button id="themeToggle" class="btn btn-theme">🌙</button>
                <button id="logoutBtn" class="btn btn-logout">Logout</button>
            </div>
        </nav>

        <!-- Main Layout -->
        <div class="main-layout">
            <!-- Sidebar -->
            <aside class="sidebar">
                <!-- Chat Assistant -->
                <h3>Robot Control</h3>
                <div class="chatbot-container">
                    <div id="chatMessages" class="chat-messages">
                        <div class="chat-message bot-message">
                            <div class="message-content">Hello! I'm your robot control assistant. You can give me tasks for the robot to execute!</div>
                        </div>
                    </div>
                    <div class="chat-input-container">
                        <input type="text" id="chatInput" placeholder="Give robot a task..." />
                        <button id="sendChatBtn" class="btn btn-send">Send</button>
                    </div>
                </div>
            </aside>

            <!-- Main Content -->
            <main class="main-content">
                <!-- Dashboard Page -->
                <div id="dashboardPage" class="page active">
                    <div class="page-header">
                        <div>
                            <h1>Robot Simulator</h1>
                            <p>Monitor and control your robot</p>
                        </div>
                    </div>

                    <div id="cardGrid" class="card-grid">
                        <div class="card" id="simulatorCard" data-topic="simulator">
                            <div class="card-header">
                                <div class="card-title">Simulator</div>
                                <div class="card-icon">🤖</div>
                            </div>
                            <div class="card-content">
                                <canvas id="robotCanvas" width="600" height="600" style="border: 1px solid #ddd; max-width: 100%;"></canvas>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Settings Page -->
                <div id="settingsPage" class="page">
                    <div class="page-header">
                        <h1>Settings</h1>
                    </div>
                    <form id="settingsForm" class="settings-form">
                        <div class="form-group">
                            <label for="displayName">Display Name:</label>
                            <input type="text" id="displayName" name="displayName" value="Admin User">
                        </div>
                        <div class="form-group">
                            <label for="email">Email:</label>
                            <input type="email" id="email" name="email" value="admin@example.com">
                        </div>
                        <div class="form-group">
                            <label for="theme">Theme:</label>
                            <select id="theme" name="theme">
                                <option value="light">Light</option>
                                <option value="dark">Dark</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="notifications">
                                <input type="checkbox" id="notifications" name="notifications" checked>
                                Enable Notifications
                            </label>
                        </div>
                        <div class="form-group">
                            <label for="language">Language:</label>
                            <select id="language" name="language">
                                <option value="en">English</option>
                                <option value="es">Spanish</option>
                                <option value="fr">French</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="timezone">Timezone:</label>
                            <select id="timezone" name="timezone">
                                <option value="UTC">UTC</option>
                                <option value="EST">EST</option>
                                <option value="PST">PST</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary">Save Settings</button>
                        <div id="settingsMessage" class="success-message"></div>
                    </form>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
